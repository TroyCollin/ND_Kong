networks:
  kong-net:
    name: kong-net
    driver: bridge

volumes:
  kong_db_data:

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  kong-db:
    image: postgres:15-alpine
    container_name: kong-database
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong_secret_password
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Database Migration Bootstrap Service
  # -------------------------------------------------------------
  kong-migrations:
    image: kong:3.8  # Using a stable, well-supported long-term version
    container_name: kong-migrations
    networks:
      - kong-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret_password
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy

  # -------------------------------------------------------------
  # 3. Main Kong Gateway Service
  # -------------------------------------------------------------
  kong:
    image: kong:3.8
    container_name: kong-gateway
    networks:
      - kong-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret_password
      KONG_PG_DATABASE: kong
      
      # Admin & GUI Setup (Enables Kong Manager)
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"      # Standard HTTP Traffic (Proxy)
      - "8443:8443"      # Secure HTTPS Traffic (Proxy)
      - "8001:8001"      # Admin Loopback API
      - "8002:8002"      # Kong Manager Web GUI Dashboard
    restart: unless-stopped
    depends_on:
      kong-migrations:
        condition: service_completed_successfully

